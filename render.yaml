# Render Blueprint for AlertAid
# NOTE: fill DB / secret values in Render dashboard, do not commit real values here.
services:
  - type: web
    name: alertaid-backend
    plan: starter
    env: docker
    dockerfilePath: backend/Alertaid/Dockerfile
    dockerContext: backend/Alertaid
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://alertaid-backend.onrender.com
      - key: PAYMENT_GATEWAY_PROVIDER
        value: razorpay
      - key: PAYMENT_RAZORPAY_KEY_ID
        sync: false
      - key: PAYMENT_RAZORPAY_KEY_SECRET
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: ALERTAID_NOTIFICATIONS_EMAIL_ENABLED
        value: "true"
      - key: ALERTAID_NOTIFICATIONS_FROM
        sync: false
      - key: ALERTAID_NOTIFICATIONS_REPORT_SUBJECT
        value: New AlertAid report submitted
      - key: ALERTAID_NOTIFICATIONS_BATCH_SIZE
        value: "50"
      # --- Supabase Postgres connection, set these in Render dashboard ---
      # Get values from Supabase -> Project Settings -> Database -> Connection string (pooler URI)
      - key: SPRING_DATASOURCE_URL
        sync: false
        # example: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: HIKARI_MAX_POOL
        value: "8"
