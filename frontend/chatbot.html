<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <style id="alertaid-shared-components">
        :root {
            --color-bg: #fafbfc;
            --color-surface: #ffffff;
            --color-surface-soft: #fef3ef;
            --color-muted: #666666;
            --color-text: #1a1a1a;
            --color-primary: #FF3B30;
            --color-secondary: #FF6F00;
            --color-gradient: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            --color-border: rgba(26, 26, 26, 0.08);
            --color-shadow-soft: 0 20px 45px rgba(17, 24, 39, 0.15);
            --color-nav-bg: rgba(255, 255, 255, 0.95);
            --color-sidebar-bg-top: rgba(255, 86, 33, 0.98);
        }
        html[data-theme="dark"] {
            --color-bg: #121212;
            --color-surface: #1e1e1e;
            --color-surface-soft: #281c1b;
            --color-muted: #aaaaaa;
            --color-text: #ffffff;
            --color-primary: #FF6F00;
            --color-secondary: #FF3B30;
            --color-gradient: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);

            --color-sidebar-bg-top: rgba(255, 111, 0, 0.98);
        }
        body {
            min-height: 100vh;
            background: var(--color-bg) !important;
            color: var(--color-text);
            transition: background 0.4s, color 0.4s;
            font-family: 'Inter', sans-serif;
            padding-top: 150px;
        }
        select option, select optgroup { color: #111 !important; background: #fff !important; }
        html[data-theme="dark"] select option,
        html[data-theme="dark"] select optgroup { color: #fff !important; background: #333 !important; }
        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            background: var(--color-nav-bg);

        .nav-brand { font-size: 1.9rem; font-weight: 800; color: var(--color-primary); text-decoration: none; transition: color 0.4s; }

        .weather-info { font-size: 0.85rem; text-align: left; }
        .nav-signin { display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; text-decoration: none; background: var(--color-gradient); padding: 10px 26px; border-radius: 999px; box-shadow: 0 12px 25px rgba(255, 59, 48, 0.35); border: none; font-size: 1rem; transition: transform 0.2s ease, box-shadow 0.2s ease; }

            margin-right: 8px;
        }
        .nav-signin:hover { transform: translateY(-2px); box-shadow: 0 18px 30px rgba(255, 59, 48, 0.4); }

        .sidebar { height: 100%; width: 0; position: fixed; top: 0; left: 0; background: none !important; color: var(--color-text); overflow-x: hidden; transition: 0.4s; padding-top: 110px; z-index: 1000; box-shadow: var(--color-shadow-soft); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; }
        .sidebar-content { width: 100%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; background: var(--color-sidebar-bg-top) !important; padding-top: 20px; }
        .sidebar a { color: #fff !important; font-weight: 600; padding: 12px 32px; margin-right: 20px; display: flex; align-items: center; gap: 12px; border-radius: 0 20px 20px 0; transition: background 0.2s ease, transform 0.2s ease; text-decoration: none; }

        html[data-theme="dark"] .theme-toggle { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); box-shadow: none; }
        .theme-toggle:hover { transform: translateY(-1px); background: rgba(255,59,48,0.05); }

<div class="widget-container">
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <div class="text-xl font-bold">
                    <i class="fas fa-robot mr-2"></i> AlertAid AI
                </div>

                </button>
            </div>

            <div class="chat-messages" id="chatMessages">
                </div>

            <div class="chat-input">
                <form id="chatForm">
                    <input type="text" id="chatInput" placeholder="Ask about disasters, resources, or safety...">
                    <button type="submit" id="sendButton">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>

    <script>
        // ===============================================
        // === 2. Consolidated JavaScript from chatbot.js/html ===
        // ===============================================
        
        const chatPanel = document.getElementById('chatPanel');
        const toggleButton = document.getElementById('toggleChat');
        const closeButton = document.getElementById('closeChat');
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        
        // --- Chatbot State and API Setup ---
        // NOTE: Replace this with your actual Gemini API key if running locally or on a server.
        // For security, an API key should ideally be handled on the server side (backend).
        // Using a placeholder here as the environment is unknown.
        const API_KEY = ""; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`;
        let chatHistory = [];
        let isChatOpen = false;

        // --- Utility Functions ---

        function appendMessage(text, type, sources = []) {
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${type}`;
            
            // Convert markdown style bold/italics to HTML (since this is not a markdown renderer)
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formattedText = formattedText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            bubble.innerHTML = formattedText;
            
            if (sources.length > 0) {
                const sourceDiv = document.createElement('div');
                sourceDiv.className = 'source-cite';
                sourceDiv.innerHTML = '<strong>Sources:</strong> ' + sources.map(s => `<a href="${s.uri}" target="_blank" style="color: #10b981; text-decoration: underline;">${s.title}</a>`).join(', ');
                bubble.appendChild(sourceDiv);
            }

            chatMessages.appendChild(bubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showLoading() {
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'message-bubble bot loading-indicator';
            loadingBubble.innerHTML = 'Analyzing<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
            chatMessages.appendChild(loadingBubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideLoading() {
            const loadingIndicator = chatMessages.querySelector('.loading-indicator');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }
        }
        
        function toggleChat() {
            isChatOpen = !isChatOpen;
            chatPanel.classList.toggle('open', isChatOpen);
            toggleButton.setAttribute('aria-expanded', isChatOpen ? 'true' : 'false');
            if (isChatOpen) {
                chatInput.focus();
            }
        }

        // --- API & Core Chat Logic ---
        
        async function exponentialBackoffFetch(url, options = {}, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.status !== 429) { 
                        return response;
                    }
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                }
            }
            throw new Error('API request failed after multiple retries.');
        }

        async function generateContent(userQuery) {
            if (!API_KEY) {
                return { text: "API Key is missing. Please configure the API_KEY in the script.", sources: [] };
            }
            
            // Use only the last 5 exchanges to keep history small and relevant
            const recentHistory = chatHistory.slice(-10);
            recentHistory.push({ role: "user", parts: [{ text: userQuery }] });

            const systemPrompt = "You are the AlertAid disaster and emergency information assistant. Provide helpful, concise advice and facts about disaster safety, preparedness, resources, and reporting processes. Use real-time web search (Google Search grounding) to ensure information is current. Respond professionally, using markdown for formatting where appropriate.";

            const payload = {
                contents: recentHistory,
                tools: [{ "google_search": {} }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const response = await exponentialBackoffFetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    
                    let sources = [];
                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attribution => ({
                                uri: attribution.web?.uri,
                                title: attribution.web?.title,
                            }))
                            .filter(source => source.uri && source.title);
                    }

                    return { text, sources };

                } else {
                    console.error("Gemini API returned empty response:", result);
                    return { text: "I'm sorry, I couldn't generate a response. Please try rephrasing your question.", sources: [] };
                }

            } catch (e) {
                console.error("Chat API Error:", e);
                return { text: "I'm experiencing connectivity issues or the API is unavailable right now. Please check the console for details.", sources: [] };
            }
        }

        async function handleChatSubmission(event) {
            event.preventDefault();
            const userQuery = chatInput.value.trim();

            if (!userQuery) return;

            appendMessage(userQuery, 'user');
            chatInput.value = '';
            sendButton.disabled = true;

            showLoading();

            const { text, sources } = await generateContent(userQuery);

            hideLoading();
            appendMessage(text, 'bot', sources);

            // Update history only if the API call was successful
            if (!text.includes("API Key is missing") && !text.includes("connectivity issues")) {
                chatHistory.push({ role: "user", parts: [{ text: userQuery }] });
                chatHistory.push({ role: "model", parts: [{ text: text }] });
            }
            
            sendButton.disabled = false;
        }


        // --- Initialization ---

        function initChat() {
            const welcomeMessage = `
            Welcome to the **AlertAid AI Assistant!**
            
            AlertAid is a **comprehensive disaster-response platform** designed to improve communication and coordination during emergencies like floods, earthquakes, and industrial accidents.
            
            *Ask me about:*
            1.  How to submit a report?

            3.  Volunteer or donation processes.
            `;

            appendMessage(welcomeMessage, 'bot');
            
            // Event Listeners
            toggleButton.addEventListener('click', toggleChat);
            closeButton.addEventListener('click', toggleChat);
            chatForm.addEventListener('submit', handleChatSubmission);

        // Run Initialization immediately upon script execution
        initChat();

    </script>
    <script id="alertaid-shared-components">
        const THEME_STORAGE_KEY = 'theme';
        const HTML_ELEMENT = document.documentElement;
        function applyTheme(theme) {
            HTML_ELEMENT.setAttribute('data-theme', theme);
            document.body.setAttribute('data-theme', theme);
        }
        function setTheme(theme) {
            applyTheme(theme);
            try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch(e){}
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            const display = document.getElementById('currentThemeDisplay');
            if (theme === 'dark') {
                if (icon) icon.className = 'fas fa-sun';
                if (text) text.textContent = 'Light Theme';
                if (display) display.textContent = 'Dark';
            } else {
                if (icon) icon.className = 'fas fa-moon';
                if (text) text.textContent = 'Dark Theme';
                if (display) display.textContent = 'Light';
            }
        }
        window.toggleTheme = function() {
            const next = HTML_ELEMENT.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            setTheme(next);
        }
        window.openNav = function(){ const el = document.getElementById('mySidebar'); if (el) el.style.width = '260px'; }
        window.closeNav = function(){ const el = document.getElementById('mySidebar'); if (el) el.style.width = '0'; }
        function showPopup(message, opts){
            const modal = document.getElementById('app-modal');
            const body = document.getElementById('app-modal-body');
            const titleEl = document.getElementById('app-modal-title');
            const closeBtn = document.getElementById('app-modal-close');
            const okBtn = document.getElementById('app-modal-ok');
            const cancelBtn = document.getElementById('app-modal-cancel');
            if (!modal || !body) return console.error('Modal elements missing', message);
            const options = opts || {};
            const isConfirm = options.type === 'confirm';
            titleEl.textContent = options.title || (isConfirm ? 'Confirmation' : 'Notice');
            body.textContent = (message == null ? '' : String(message));
            okBtn.textContent = options.okText || (isConfirm ? 'Confirm' : 'OK');
            okBtn.className = `app-btn ${options.okClass || (isConfirm ? 'app-btn-critical' : '')}`;
            cancelBtn.style.display = isConfirm ? 'block' : 'none';
            function hide(result = false){ modal.classList.remove('show'); cleanup(); if(isConfirm && typeof options.callback === 'function'){ options.callback(result); } }
            function cleanup(){ closeBtn.removeEventListener('click', onClose); okBtn.removeEventListener('click', onOk); cancelBtn.removeEventListener('click', onCancel); modal.removeEventListener('click', onBackdrop); document.removeEventListener('keydown', onEsc); }
            function onClose(){ hide(false); }
            function onOk(){ hide(true); }
            function onCancel(){ hide(false); }
            function onBackdrop(e){ if(e.target === modal) hide(false); }
            function onEsc(e){ if(e.key === 'Escape') hide(false); }
            closeBtn.addEventListener('click', onClose);
            okBtn.addEventListener('click', onOk);
            cancelBtn.addEventListener('click', onCancel);
            modal.addEventListener('click', onBackdrop);
            document.addEventListener('keydown', onEsc);
            modal.classList.add('show');
        }
        function showConfirm(message, callback){ showPopup(message, { type:'confirm', title:'Action Required', okText:'Yes', okClass:'app-btn-critical', cancelText:'Cancel', callback }); }
        window.alert = function(msg){ try { showPopup(msg); } catch { console.error('Modal failed', msg); } };
        window.showPopup = showPopup;
        window.showConfirm = showConfirm;
        function getValidToken(){ const token = localStorage.getItem('token'); return token && token !== 'null' ? token : null; }
        window.checkAuthStatus = function(){
            const token = getValidToken();
            const userOptions = document.getElementById('userOnlyOptions');
            const guestOptions = document.getElementById('guestOnlyOptions');
            const navAuthLink = document.getElementById('navAuthLink');
            if (token){
                if (userOptions) userOptions.style.display = 'flex';
                if (guestOptions) guestOptions.style.display = 'none';
                if (navAuthLink){ navAuthLink.innerHTML = '<i class=\"fas fa-tachometer-alt\"></i> Dashboard'; navAuthLink.href = resolveDashboardHref(); }
            } else {
                if (userOptions) userOptions.style.display = 'none';
                if (guestOptions) guestOptions.style.display = 'block';
                if (navAuthLink){ navAuthLink.innerHTML = '<i class=\"fas fa-sign-in-alt\"></i> Sign In'; navAuthLink.href = 'login.html'; }
            }
        }
        window.getLocation = function(){
            if (navigator.geolocation){
                navigator.geolocation.getCurrentPosition((p)=>{
                    showPopup(`Your Location:
Latitude: ${p.coords.latitude.toFixed(6)}
Longitude: ${p.coords.longitude.toFixed(6)}`, { title:'Current Location' });
                },()=>showPopup('Unable to retrieve your location.', { title:'Location Error' }));
            } else {
                showPopup('Geolocation is not supported by this browser.', { title:'Location Error' });
            }
        }
        window.showNotifications = function(){ if (!getValidToken()) { showPopup('Please sign in to view notifications.', { title:'Authorization Required' }); return; } showPopup('Notifications will appear here.', { title:'Notifications' }); }
        window.showProfile = function(){ if (!getValidToken()) { showPopup('Please sign in to view profile.', { title:'Authorization Required' }); return; } showPopup('Profile Information (demo)', { title:'User Profile' }); }
        window.signOut = function(){ showConfirm('Are you sure you want to sign out?', (confirmed)=>{ if (confirmed){ try { localStorage.removeItem('token'); } catch {} window.location.replace('login.html'); } }); }
        document.addEventListener('DOMContentLoaded', function(){ setTheme(localStorage.getItem(THEME_STORAGE_KEY) || 'light'); checkAuthStatus(); });
    </script>
</body>
</html>
