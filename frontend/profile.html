  <script type="module">
    import { apiFetch } from './auth-client.js';

    const form = document.getElementById('profileForm');
    const statusBanner = document.getElementById('statusBanner');
    const resetBtn = document.getElementById('resetBtn');
    const fields = [
      'name','phone','address','state','city','pincode','gender',
      'orgName','orgType','licenseNumber','services','supportMode',
      'expertise','availability','experienceLevel'
    ];
    let loadedProfile = {};

    function setStatus(message, type = 'success') {
      statusBanner.textContent = message;
      statusBanner.className = `status show ${type}`;
    }

    function clearStatus() {
      statusBanner.className = 'status';
      statusBanner.textContent = '';
    }

    function fillForm(data) {
      loadedProfile = data || {};
      fields.forEach(key => {
        const el = form.elements[key];
        if (el) el.value = data?.[key] ?? '';
      });
      document.getElementById('profileName').textContent = data?.name || 'User';
      document.getElementById('profileEmail').textContent = data?.email || '';
      document.getElementById('roleBadge').textContent = data?.role || '--';
      const meta = [];
      if (data?.city) meta.push(data.city);
      if (data?.state) meta.push(data.state);
      if (data?.createdAt) meta.push(`Since ${new Date(data.createdAt).getFullYear()}`);
      document.getElementById('profileMeta').textContent = meta.join(' • ');
      const initials = (data?.name || 'A').split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
      document.getElementById('avatar').innerHTML = `<span>${initials}</span>`;
    }

    async function loadProfile() {
      try {
        const res = await apiFetch('/api/profile/me');
        const data = await res.json();
        fillForm(data);
      } catch (err) {
        console.error('Failed to load profile', err);
        setStatus('Unable to load profile. Please refresh.', 'error');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearStatus();
      const body = {};
      fields.forEach(key => {
        const current = form.elements[key]?.value ?? '';
        if ((loadedProfile[key] ?? '') !== current) {
          body[key] = current || null;
        }
      });
      try {
        const res = await apiFetch('/api/profile/me', {
          method: 'PUT',
          body: JSON.stringify(body)
        });
        const updated = await res.json();
        fillForm(updated);
        setStatus('Profile updated successfully.');
      } catch (err) {
        console.error(err);
        setStatus('Unable to update profile. Please try again.', 'error');
      }
    });

    resetBtn.addEventListener('click', () => {
      fillForm(loadedProfile);
      clearStatus();
    });

    const logoutLink = document.getElementById('logoutLink');
    logoutLink.addEventListener('click', (e) => {
      e.preventDefault();
      try {
        localStorage.removeItem('token');
        localStorage.removeItem('role');
        localStorage.removeItem('alertaid.role');
      } catch {}
      window.location.replace('login.html');
    });

    loadProfile();
  </script>

            document.body.setAttribute('data-theme', theme);
        }
        function setTheme(theme) {
            applyTheme(theme);
            try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch(e){}
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            const display = document.getElementById('currentThemeDisplay');
            if (theme === 'dark') {
                if (icon) icon.className = 'fas fa-sun';
                if (text) text.textContent = 'Light Theme';
                if (display) display.textContent = 'Dark';
            } else {
                if (icon) icon.className = 'fas fa-moon';
                if (text) text.textContent = 'Dark Theme';
                if (display) display.textContent = 'Light';
            }
        }
        window.toggleTheme = function() {
            const next = HTML_ELEMENT.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            setTheme(next);
        }
        window.openNav = function(){ const el = document.getElementById('mySidebar'); if (el) el.style.width = '260px'; }
        window.closeNav = function(){ const el = document.getElementById('mySidebar'); if (el) el.style.width = '0'; }
        function showPopup(message, opts){
            const modal = document.getElementById('app-modal');
            const body = document.getElementById('app-modal-body');
            const titleEl = document.getElementById('app-modal-title');
            const closeBtn = document.getElementById('app-modal-close');
            const okBtn = document.getElementById('app-modal-ok');
            const cancelBtn = document.getElementById('app-modal-cancel');
            if (!modal || !body) return console.error('Modal elements missing', message);
            const options = opts || {};
            const isConfirm = options.type === 'confirm';
            titleEl.textContent = options.title || (isConfirm ? 'Confirmation' : 'Notice');
            body.textContent = (message == null ? '' : String(message));
            okBtn.textContent = options.okText || (isConfirm ? 'Confirm' : 'OK');
            okBtn.className = `app-btn ${options.okClass || (isConfirm ? 'app-btn-critical' : '')}`;
            cancelBtn.style.display = isConfirm ? 'block' : 'none';
            function hide(result = false){ modal.classList.remove('show'); cleanup(); if(isConfirm && typeof options.callback === 'function'){ options.callback(result); } }
            function cleanup(){ closeBtn.removeEventListener('click', onClose); okBtn.removeEventListener('click', onOk); cancelBtn.removeEventListener('click', onCancel); modal.removeEventListener('click', onBackdrop); document.removeEventListener('keydown', onEsc); }
            function onClose(){ hide(false); }
            function onOk(){ hide(true); }
            function onCancel(){ hide(false); }
            function onBackdrop(e){ if(e.target === modal) hide(false); }
            function onEsc(e){ if(e.key === 'Escape') hide(false); }
            closeBtn.addEventListener('click', onClose);
            okBtn.addEventListener('click', onOk);
            cancelBtn.addEventListener('click', onCancel);
            modal.addEventListener('click', onBackdrop);
            document.addEventListener('keydown', onEsc);
            modal.classList.add('show');
        }
        function showConfirm(message, callback){ showPopup(message, { type:'confirm', title:'Action Required', okText:'Yes', okClass:'app-btn-critical', cancelText:'Cancel', callback }); }
        window.alert = function(msg){ try { showPopup(msg); } catch { console.error('Modal failed', msg); } };
        window.showPopup = showPopup;
        window.showConfirm = showConfirm;
        function getValidToken(){ const token = localStorage.getItem('token'); return token && token !== 'null' ? token : null; }
        window.checkAuthStatus = function(){
            const token = getValidToken();
            const userOptions = document.getElementById('userOnlyOptions');
            const guestOptions = document.getElementById('guestOnlyOptions');
            const navAuthLink = document.getElementById('navAuthLink');
            if (token){
                if (userOptions) userOptions.style.display = 'flex';
                if (guestOptions) guestOptions.style.display = 'none';
                if (navAuthLink){ navAuthLink.innerHTML = '<i class=\"fas fa-tachometer-alt\"></i> Dashboard'; navAuthLink.href = resolveDashboardHref(); }
            } else {
                if (userOptions) userOptions.style.display = 'none';
                if (guestOptions) guestOptions.style.display = 'block';
                if (navAuthLink){ navAuthLink.innerHTML = '<i class=\"fas fa-sign-in-alt\"></i> Sign In'; navAuthLink.href = 'login.html'; }
            }
        }
        window.getLocation = function(){
            if (navigator.geolocation){
                navigator.geolocation.getCurrentPosition((p)=>{
                    showPopup(`Your Location:
Latitude: ${p.coords.latitude.toFixed(6)}
Longitude: ${p.coords.longitude.toFixed(6)}`, { title:'Current Location' });
                },()=>showPopup('Unable to retrieve your location.', { title:'Location Error' }));
            } else {
                showPopup('Geolocation is not supported by this browser.', { title:'Location Error' });
            }
        }
        window.showNotifications = function(){ if (!getValidToken()) { showPopup('Please sign in to view notifications.', { title:'Authorization Required' }); return; } showPopup('Notifications will appear here.', { title:'Notifications' }); }
        window.showProfile = function(){ if (!getValidToken()) { showPopup('Please sign in to view profile.', { title:'Authorization Required' }); return; } showPopup('Profile Information (demo)', { title:'User Profile' }); }
        window.signOut = function(){ showConfirm('Are you sure you want to sign out?', (confirmed)=>{ if (confirmed){ try { localStorage.removeItem('token'); } catch {} window.location.replace('login.html'); } }); }
        document.addEventListener('DOMContentLoaded', function(){ setTheme(localStorage.getItem(THEME_STORAGE_KEY) || 'light'); checkAuthStatus(); });
    </script>
</body>
</html>
