<script>
  let razorpayScriptPromise = null;
  const paymentOrderEndpoint = '/api/payments/order';

  function loadPaymentScript() {
    if (window.Razorpay) return Promise.resolve();
    if (razorpayScriptPromise) return razorpayScriptPromise;
    razorpayScriptPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://checkout.razorpay.com/v1/checkout.js';
      script.onload = () => resolve();
      script.onerror = () => reject(new Error('Unable to load payment gateway script'));
      document.body.appendChild(script);
    });
    return razorpayScriptPromise;
  }

  async function createPaymentOrder(amount, purpose, token) {
    const res = await fetch(paymentOrderEndpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({
        amount: Math.round(amount),
        currency: 'INR',
        receipt: `don-${Date.now()}`,
        notes: { purpose: purpose || 'campaign-donation' }
      })
    });
    if (!res.ok) throw new Error('Unable to initiate payment');
    return res.json();
  }

  async function launchPaymentCheckout(order, donorMeta) {
    if (order.provider === 'MOCK') {
      return {
        order_id: order.orderId,
        payment_id: `pay_mock_${Date.now()}`,
        signature: 'mock-signature'
      };
    }
    await loadPaymentScript();
    return new Promise((resolve, reject) => {
      const gateway = new Razorpay({
        key: order.key,
        amount: order.amount,
        currency: order.currency,
        name: 'AlertAid Campaign',
        description: donorMeta.purpose || 'Relief donation',
        order_id: order.orderId,
        handler: response => resolve(response),
        modal: {
          ondismiss: () => reject(new Error('Payment cancelled'))
        },
        prefill: {
          name: donorMeta.name || 'AlertAid Donor',
          email: donorMeta.email || ''
        },
        theme: { color: '#28A745' }
      });
      gateway.on('payment.failed', event => {
        reject(new Error(event.error.description || 'Payment failed'));
      });
      gateway.open();
    });
  }

  async function recordDonation(campaignId, payload, token) {
    const res = await fetch(`/api/donations/${campaignId}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Saving donation failed');
    return res.json();
  }

    // Highlight selected amount & autofill input
    function setAmount(value) {
      document.getElementById("custom").value = value;
      document.querySelectorAll(".amount-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
    }

    // Get query params
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

// On page load
window.onload = function() {
  const campaignTitle = getQueryParam("title");
  const campaignId = getQueryParam("campaignId");

  if (campaignTitle) {
    document.getElementById("campaignTitle").innerText = campaignTitle;
  }

  if (campaignId) {
    document.getElementById("campaignIdInput").value = campaignId;
  }

  // Attach submit handler to call backend donations API
  const form = document.getElementById('donationForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = localStorage.getItem('token');
    if (!token) { showToast('Please sign in first.', 'warning'); return; }
    const cid = document.getElementById('campaignIdInput').value;
    const amount = parseFloat(document.getElementById('custom').value || '0');
    if (!cid || !amount || isNaN(amount) || amount <= 0) {
      showToast('Please provide a valid amount.', 'warning');
      return;
    }
    const method = document.getElementById('method').value;
    if (!method) { showToast('Select a payment method.', 'warning'); return; }
    const userEmail = localStorage.getItem('email') || '';
    const donorName = localStorage.getItem('name') || 'Anonymous';
    try {
      const demoUrl = 'https://goldylokhande7.mojo.page/monetary-donation-p';
      window.open(demoUrl, '_blank', 'noopener');
      const payload = {
        donorName,
        donorEmail: userEmail,
        amount,
        currency: 'INR',
        paymentMethod: 'EXTERNAL_DEMO',
        paymentStatus: 'PENDING',
        gatewayOrderId: `demo_${Date.now()}`,
        paymentReference: 'demo-link',
        testMode: true
      };
      await recordDonation(cid, payload, token);
      showToast('Demo payment page opened. Once confirmed, we will mark the donation as received.', 'success');
      form.reset();
    } catch (e) {
      showToast(e.message || 'Error processing donation.', 'error');
    }
  });
}
</script>

    <script id="alertaid-shared-components">
        const THEME_STORAGE_KEY = 'theme';
        const HTML_ELEMENT = document.documentElement;
        function applyTheme(theme) {
            HTML_ELEMENT.setAttribute('data-theme', theme);
            document.body.setAttribute('data-theme', theme);
        }
        function setTheme(theme) {
            applyTheme(theme);
            try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch(e){}
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            const display = document.getElementById('currentThemeDisplay');
            if (theme === 'dark') {
                if (icon) icon.className = 'fas fa-sun';
                if (text) text.textContent = 'Light Theme';
                if (display) display.textContent = 'Dark';
            } else {
                if (icon) icon.className = 'fas fa-moon';
                if (text) text.textContent = 'Dark Theme';
                if (display) display.textContent = 'Light';
            }
        }
        window.toggleTheme = function() {
            const next = HTML_ELEMENT.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            setTheme(next);
        }
        window.openNav = function(){ const el = document.getElementById('mySidebar'); if (el) el.style.width = '260px'; }
        window.closeNav = function(){ const el = document.getElementById('mySidebar'); if (el) el.style.width = '0'; }
        function showPopup(message, opts){
            const modal = document.getElementById('app-modal');
            const body = document.getElementById('app-modal-body');
            const titleEl = document.getElementById('app-modal-title');
            const closeBtn = document.getElementById('app-modal-close');
            const okBtn = document.getElementById('app-modal-ok');
            const cancelBtn = document.getElementById('app-modal-cancel');
            if (!modal || !body) return console.error('Modal elements missing', message);
            const options = opts || {};
            const isConfirm = options.type === 'confirm';
            titleEl.textContent = options.title || (isConfirm ? 'Confirmation' : 'Notice');
            body.textContent = (message == null ? '' : String(message));
            okBtn.textContent = options.okText || (isConfirm ? 'Confirm' : 'OK');
            okBtn.className = `app-btn ${options.okClass || (isConfirm ? 'app-btn-critical' : '')}`;
            cancelBtn.style.display = isConfirm ? 'block' : 'none';
            function hide(result = false){ modal.classList.remove('show'); cleanup(); if(isConfirm && typeof options.callback === 'function'){ options.callback(result); } }
            function cleanup(){ closeBtn.removeEventListener('click', onClose); okBtn.removeEventListener('click', onOk); cancelBtn.removeEventListener('click', onCancel); modal.removeEventListener('click', onBackdrop); document.removeEventListener('keydown', onEsc); }
            function onClose(){ hide(false); }
            function onOk(){ hide(true); }
            function onCancel(){ hide(false); }
            function onBackdrop(e){ if(e.target === modal) hide(false); }
            function onEsc(e){ if(e.key === 'Escape') hide(false); }
            closeBtn.addEventListener('click', onClose);
            okBtn.addEventListener('click', onOk);
            cancelBtn.addEventListener('click', onCancel);
            modal.addEventListener('click', onBackdrop);
            document.addEventListener('keydown', onEsc);
            modal.classList.add('show');
        }
        function showConfirm(message, callback){ showPopup(message, { type:'confirm', title:'Action Required', okText:'Yes', okClass:'app-btn-critical', cancelText:'Cancel', callback }); }
        window.alert = function(msg){ try { showPopup(msg); } catch { console.error('Modal failed', msg); } };
        window.showPopup = showPopup;
        window.showConfirm = showConfirm;
        function getValidToken(){ const token = localStorage.getItem('token'); return token && token !== 'null' ? token : null; }
        window.checkAuthStatus = function(){
            const token = getValidToken();
            const userOptions = document.getElementById('userOnlyOptions');
            const guestOptions = document.getElementById('guestOnlyOptions');
            const navAuthLink = document.getElementById('navAuthLink');
            if (token){
                if (userOptions) userOptions.style.display = 'flex';
                if (guestOptions) guestOptions.style.display = 'none';
                if (navAuthLink){ navAuthLink.innerHTML = '<i class=\"fas fa-tachometer-alt\"></i> Dashboard'; navAuthLink.href = resolveDashboardHref(); }
            } else {
                if (userOptions) userOptions.style.display = 'none';
                if (guestOptions) guestOptions.style.display = 'block';
                if (navAuthLink){ navAuthLink.innerHTML = '<i class=\"fas fa-sign-in-alt\"></i> Sign In'; navAuthLink.href = 'login.html'; }
            }
        }
        window.getLocation = function(){
            if (navigator.geolocation){
                navigator.geolocation.getCurrentPosition((p)=>{
                    showPopup(`Your Location:
Latitude: ${p.coords.latitude.toFixed(6)}
Longitude: ${p.coords.longitude.toFixed(6)}`, { title:'Current Location' });
                },()=>showPopup('Unable to retrieve your location.', { title:'Location Error' }));
            } else {
                showPopup('Geolocation is not supported by this browser.', { title:'Location Error' });
            }
        }
        window.showNotifications = function(){ if (!getValidToken()) { showPopup('Please sign in to view notifications.', { title:'Authorization Required' }); return; } showPopup('Notifications will appear here.', { title:'Notifications' }); }
        window.showProfile = function(){ if (!getValidToken()) { showPopup('Please sign in to view profile.', { title:'Authorization Required' }); return; } showPopup('Profile Information (demo)', { title:'User Profile' }); }
        window.signOut = function(){ showConfirm('Are you sure you want to sign out?', (confirmed)=>{ if (confirmed){ try { localStorage.removeItem('token'); } catch {} window.location.replace('login.html'); } }); }
        document.addEventListener('DOMContentLoaded', function(){ setTheme(localStorage.getItem(THEME_STORAGE_KEY) || 'light'); checkAuthStatus(); });
    </script>
</body>
</html>
<script>
  function showToast(message, variant = 'info') {
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      container.style.position = 'fixed';
      container.style.top = '20px';
      container.style.right = '20px';
      container.style.zIndex = '10000';
      container.style.display = 'flex';
      container.style.flexDirection = 'column';
      container.style.gap = '10px';
      document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.padding = '12px 16px';
    toast.style.borderRadius = '10px';
    toast.style.minWidth = '220px';
    toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.35)';
    toast.style.background = variant === 'error' ? 'rgba(239,68,68,0.95)' :
      variant === 'warning' ? 'rgba(253,224,71,0.95)' :
      variant === 'success' ? 'rgba(16,185,129,0.95)' :
      'rgba(15,23,42,0.95)';
    toast.style.color = '#fff';
    toast.style.fontWeight = '600';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '×';
    closeBtn.style.marginLeft = '16px';
    closeBtn.style.color = '#fff';
    closeBtn.style.background = 'transparent';
    closeBtn.style.border = 'none';
    closeBtn.style.fontSize = '18px';
    closeBtn.style.cursor = 'pointer';
    closeBtn.onclick = () => toast.remove();
    toast.appendChild(closeBtn);
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.transition = 'opacity 0.5s ease';
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 500);
    }, 4000);
  }
