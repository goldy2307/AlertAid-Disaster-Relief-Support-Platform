# Test Configuration for AlertAid
# Uses H2 in-memory database for testing

spring.application.name=Alertaid-Test

# H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (useful for debugging tests)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT settings for testing (use a fixed secret for consistent tests)
app.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWZvci1hbGVydGFpZC10ZXN0aW5nLTMyYnl0ZXM=
app.jwt.expiration-ms=3600000

# Explicitly disable Flyway in tests - multiple ways to ensure it's disabled
spring.flyway.enabled=false
spring.flyway.check-location=false
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=false

# Test server configuration
server.port=0

# Logging configuration for tests
logging.level.com.alertaid=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG
logging.level.root=WARN

# Disable banner in tests
spring.main.banner-mode=off

# Fast startup for tests
spring.jpa.defer-datasource-initialization=true

# Additional test optimizations
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false
