spring.application.name=Alertaid

# MySQL Database Configuration (for local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alertaid_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration (dev = update is fine, prod overrides to validate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT settings - NO hardcoded fallback, must be set via env var
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Disable Flyway auto-run (using JPA update in dev)
spring.flyway.enabled=false

# Server configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript

# Connection pool settings (dev - local db, can be modest)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000}

# Payment gateway (Razorpay) - NO hardcoded keys, must be set via env var
payment.gateway.provider=${PAYMENT_GATEWAY_PROVIDER:razorpay}
payment.razorpay.keyId=${PAYMENT_RAZORPAY_KEY_ID:}
payment.razorpay.keySecret=${PAYMENT_RAZORPAY_KEY_SECRET:}

# Actuator - health/info only, env endpoint OFF (was leaking secrets)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.env.enabled=false
management.endpoints.web.base-path=/actuator
management.endpoints.web.cors.allowed-origins=http://localhost:8080

# Email configuration
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

# Notification settings
alertaid.notifications.email-enabled=${ALERTAID_NOTIFICATIONS_EMAIL_ENABLED:true}
alertaid.notifications.from=${ALERTAID_NOTIFICATIONS_FROM:alertaid.help@gmail.com}
alertaid.notifications.report-subject=${ALERTAID_NOTIFICATIONS_REPORT_SUBJECT:New AlertAid report submitted}
alertaid.notifications.batch-size=${ALERTAID_NOTIFICATIONS_BATCH_SIZE:50}

logging.level.com.alertaid.service.NotificationService=DEBUG


# ---- Frontend served directly from the frontend/ directory ----
# FRONTEND_DIR must be an ABSOLUTE path pointing at the folder that
# contains index.html (the built React app + legacy pages). Trailing
# slash matters. No classpath fallback: this is the single source of
# frontend files now (resources/static is no longer used for pages).
spring.web.resources.static-locations=file:${FRONTEND_DIR:./frontend}/
# Dev convenience: don't cache so edits show up on refresh without restart.
spring.web.resources.chain.cache=false
spring.web.resources.cache.period=0
