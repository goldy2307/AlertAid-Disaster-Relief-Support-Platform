server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration for Production - Supabase Postgres by default.
# Set SPRING_DATASOURCE_URL / USERNAME / PASSWORD from your Supabase connection info.
# Example Supabase pooled URL:
# jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# JPA/Hibernate Configuration for Production
# validate, NOT update -> use Flyway/manual SQL for schema changes in prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# Production optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript

# Connection pool - sized for free-tier DB connection caps (Supabase/Neon free ~ 20-60 total)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:8}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1

# JWT Configuration - no hardcoded fallback secret
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

spring.flyway.enabled=true

# Logging
logging.level.com.alertaid=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.com.zaxxer.hikari=WARN

# Security headers
server.error.include-stacktrace=never
server.error.include-message=never

# Payment gateway configuration (Razorpay) - set via env, never hardcode
payment.gateway.provider=${PAYMENT_GATEWAY_PROVIDER:razorpay}
payment.razorpay.keyId=${PAYMENT_RAZORPAY_KEY_ID:}
payment.razorpay.keySecret=${PAYMENT_RAZORPAY_KEY_SECRET:}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://alertaid.onrender.com}

# Actuator - env endpoint disabled (was leaking DB password/JWT secret)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.env.enabled=false
management.endpoints.web.base-path=/actuator

# Email configuration
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}

# Notification settings
alertaid.notifications.email-enabled=${ALERTAID_NOTIFICATIONS_EMAIL_ENABLED:false}
alertaid.notifications.from=${ALERTAID_NOTIFICATIONS_FROM:alertaid@example.com}
alertaid.notifications.report-subject=${ALERTAID_NOTIFICATIONS_REPORT_SUBJECT:New AlertAid report submitted}
alertaid.notifications.batch-size=${ALERTAID_NOTIFICATIONS_BATCH_SIZE:50}


# Prod: FRONTEND_DIR is set by the Dockerfile/deploy env (see below).
# Caching is fine in prod — files only change on redeploy.
spring.web.resources.static-locations=file:${FRONTEND_DIR:/app/frontend}/
spring.web.resources.chain.cache=true
spring.web.resources.cache.period=3600
